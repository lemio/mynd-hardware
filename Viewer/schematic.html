<style>
:root { color-scheme: light; --bg: #fff; --ink: #1a1a1a; --ink-2: #6e6e6a; --ink-3: #b4b3ae; --ghost: #dedcd6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161616; --ink: #e8e7e3; --ink-2: #9a9994; --ink-3: #55554f; --ghost: #3a3a37; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #161616; --ink: #e8e7e3; --ink-2: #9a9994; --ink-3: #55554f; --ghost: #3a3a37; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font: calc(14px * var(--fs, 1))/1.4 "IBM Plex Sans", system-ui, sans-serif; display: flex; flex-direction: column; }
header { padding: 20px 16px 12px; display: flex; flex-wrap: nowrap; align-items: baseline; gap: 6px 18px; white-space: nowrap; }
h1 { font-size: calc(15px * var(--fs, 1)); font-weight: 500; margin: 0; letter-spacing: .01em; }
header a { font-size: 12px; color: var(--ink-2); }
header input { font: 12px "IBM Plex Mono", monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--ink-3); padding: 3px 6px; width: 180px; }
header input:focus { outline: none; border-color: var(--ink); }
#status { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-2); }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 24px; padding: 0 16px 16px; }
.layout { position: relative; }
.layout.folded { grid-template-columns: minmax(0, 1fr); }
.layout.folded aside { position: absolute; top: 0; right: 16px; background: transparent; overflow: visible; pointer-events: none; padding: 0; }
.layout.folded aside > :not(.lg-fold) { display: none; }
.layout.folded .lg-fold { pointer-events: auto; background: var(--bg); padding: 2px 6px; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) auto; } }
#view { position: relative; min-height: 320px; overflow: hidden; }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#view canvas.dragging { cursor: grabbing; }
#view canvas.pointing { cursor: pointer; }
aside { overflow-y: auto; font-size: calc(11.5px * var(--fs, 1)); color: var(--ink-2); padding-bottom: 16px; }
aside h2 { font-size: calc(11px * var(--fs, 1)); font-weight: 500; color: var(--ink); margin: 18px 0 4px; }
aside h2:first-of-type { margin-top: 10px; }
.lg-fold { font: inherit; font-size: calc(11px * var(--fs, 1)); color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.lg-row { display: flex; align-items: center; gap: 8px; min-height: calc(22px * var(--fs, 1)); }
.lg-row canvas { flex: none; }
.lg-row.live { cursor: default; }
.lg-row.live:hover span { color: var(--ink); }
.lg-step { align-items: baseline; min-height: 0; padding: 2px 0; cursor: pointer; }
.lg-step i { flex: none; width: 14px; display: inline-block; transform: translateY(-3px); }
.lg-area { font: inherit; color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; display: block; margin: 2px 0; }
.lg-area:hover { color: var(--ink); }
.lg-links { display: flex; flex-wrap: wrap; gap: 4px 12px; }

.lg-text a { text-decoration: none; color: var(--ink-2); }

.zoom { position: absolute; right: 0; bottom: 0; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--ink-3); font: 11px "IBM Plex Mono", monospace; }
.zoom button { font: inherit; font-size: 13px; width: 30px; height: 28px; border: 0; background: none; color: var(--ink); cursor: pointer; }
.zoom span { min-width: 46px; text-align: center; color: var(--ink-2); }
#drop { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 10px; color: var(--ink-2); font-size: 13px; padding: 16px; }
#drop.show { display: grid; }
#drop code { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink); }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--bg); color: var(--ink); border: 1px solid var(--ink-3); padding: 6px 8px; font-size: calc(12px * var(--fs, 1)); line-height: 1.4; max-width: calc(340px * var(--fs, 1)); opacity: 0; }
.tip .t-name { font-weight: 500; }
.tip .t-desc { margin: 3px 0; }
.tip.pinned { pointer-events: auto; user-select: text; }
.tip .t-pins { margin-top: 3px; }
.tip .t-pn, .tip .t-pins, .tip .t-net { font-family: "IBM Plex Mono", monospace; font-size: calc(10.5px * var(--fs, 1)); color: var(--ink-2); }
</style>

<body>
<header>
  <h1>MYND main board — circuit</h1>
  <input id="find" list="finds" placeholder="find part or net" autocomplete="off" spellcheck="false"><datalist id="finds"></datalist>

</header>
<div class="layout">
  <div id="view">
    <canvas id="cv"></canvas>
    <div class="zoom"><button id="zout" title="zoom out">−</button><span id="zpct">100%</span><button id="zin" title="zoom in">+</button><button id="zfit" title="fit (F)">⤢</button></div>
    <div id="drop">
      <div>The circuit data could not be fetched. Open this page through a local server:</div>
      <div><code>cd Viewer && python3 -m http.server 8000</code> → <code>http://localhost:8000/schematic.html</code></div>

    </div>

<div class="tip" id="tip"></div>

<script>
"use strict";
// =====================================================================
// View settings, as in Schematik's circuit pages
// The default view is Schematik's ?color=multi&width=3&uniform=1&text=big.
// ?color=ink for single ink, ?width=1.1 for thin lines, ?uniform=0 for heavier supplies, ?text=normal|giant, ?select=R32C or a net name, ?area=U_MCU
// =====================================================================
const QS = new URLSearchParams(location.search);
const MULTI = !["ink", "single", "mono"].includes(QS.get("color"));
const LW = Math.min(8, Math.max(0.5, parseFloat(QS.get("width")) || 3));
const UNIFORM = QS.get("uniform") !== "0";
const TEXTSCALE = { normal: 1, big: 1.3, giant: 1.65 }[(QS.get("text") || "big").toLowerCase()] || 1.3;
const NAMESCALE = 1 + (TEXTSCALE - 1) * 0.6;
document.documentElement.style.setProperty("--fs", TEXTSCALE);
// symbols and outlines take the signal weight up to 2 px, then grow half as fast, so parts stay part of the lines
const GW = LW <= 2 ? Math.max(1.3, LW) : 2 + (LW - 2) / 2;
const RH = Math.max(4.5, 2.5 + GW), CG = Math.max(3, 1.5 + GW * 0.75);
// Schematik draws on a 20 px grid; KiCad on 2.54 mm. One Schematik pixel is this many millimetres:
const K = 2.54 / 20;
// When each kind of text appears, like the labels of a map. The unit is r: screen pixels per Schematik pixel (K × zoom),
// an absolute scale, so a bigger schematic keeps the same steps. On this board, in a typical window, "fit" ≈ 100 % and
// r 1 ≈ 590 %:  400 % ≈ 0.68 · 600 % ≈ 1.0 · 800 % ≈ 1.35 · 1000 % ≈ 1.7. Adjust here.
const SHOW_AT = {
  title: 0.45,     // chip, connector and area-box names
  tag:   0.68,     // net names at the end of lines (≈ 400 %)
  pin:   1.0,      // pin names inside chips and connectors (≈ 600 %)
  value: 1.35,     // a part's value (100n, 10k) — or its designator when it has no value to show (TP30M, ESD2C) (≈ 800 %)
  ref:   1.7,      // the designator as well (≈ 1000 %)
};
// text keeps its size on screen up to r = 1, then grows with the drawing up to this factor (and re-fits what was cut)
const GROW_MAX = 1.6;

const DATA_URL = QS.get("data") || "mynd_main.sch.json";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), view = document.getElementById("view");
const tip = document.getElementById("tip"), status = document.getElementById("status");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let INK = {};
const readInk = () => { INK = { ink: css("--ink"), ink2: css("--ink-2"), ink3: css("--ink-3"), bg: css("--bg"), ghost: css("--ghost") }; };
readInk();

let D = null;
const cam = { s: 1, x: 0, y: 0 };      // screen px = world mm × s + offset
let W = 0, H = 0, DPR = 1;

// ---------------------------------------------------------------------
// Nets: colour group, weight, tag text
// ---------------------------------------------------------------------
const group = n => n >= 0 ? D.netMeta.groups[D.netMeta.nets[n][1]] : null;
const isGround = n => n >= 0 && D.netMeta.nets[n][1] === 0;
const isPower = n => { const g = group(n); return !!(g && g[2]); };
const weight = n => !UNIFORM && isPower(n) ? LW * 1.6 : LW;           // px
const netColor = n => MULTI && n >= 0 && !isGround(n) ? group(n)[0] : INK.ink;
const shortName = n => n >= 0 ? D.netMeta.nets[n][0] : "";
const resolve = tok => typeof tok === "number" ? netColor(tok) : INK[tok] || tok;
// rails that reach almost everything do not make parts "one connection away" (used for the 3D view)
const isRail = n => isPower(n) || (D.netParts.get(n) || new Set()).size > 12;

// ---------------------------------------------------------------------
// Glyphs (Schematik's, in its pixel units), drawn along +x around 0; the caller places and turns them.
// A glyph is a list of primitives: { pts | circle, closed, stroke, fill, w (px), role, net, z }
// role: "lead" (keeps its wire's colour and weight), "body", "net"
// ---------------------------------------------------------------------
const P = (pts, o) => ({ pts, ...o });
const body = (pts, o = {}) => P(pts, { stroke: "ink", w: GW, role: "body", z: 2, ...o });
const lead = (pts, net) => P(pts, { stroke: net, w: weight(net), role: "lead", net, z: 1 });
// half extent of each two-pin glyph along its axis (where the leads stop) and across it (for label room)
const ALONG = { r: 15, c: CG, l: 9, fb: 9, d: 5, tvs: 10 };
const HALF = { r: RH + GW / 2, c: 8 + GW / 2, l: 5 + GW / 2, fb: RH + GW / 2, d: 6 + GW / 2, tvs: 6 + GW / 2, nfet: 22, pfet: 22, tp: 4 };
function glyph2(kind) {
  const g = [];
  if (kind === "r") g.push(body([-15, -RH, 15, -RH, 15, RH, -15, RH], { closed: true, fill: "bg" }));        // 1 : 3
  else if (kind === "c") { g.push(body([-CG, -8, -CG, 8]), body([CG, -8, CG, 8])); }
  else if (kind === "l") { const pts = []; for (let k = 0; k < 3; k++) for (let i = 0; i <= 8; i++) { const a = Math.PI - Math.PI * i / 8; pts.push(-9 + 6 * k + 3 + 3 * Math.cos(a), -4 * Math.sin(a)); } g.push(body(pts)); }
  else if (kind === "fb") g.push(body([-9, -RH, 9, -RH, 9, RH, -9, RH], { closed: true, fill: "ink" }));
  else if (kind === "d") g.push(body([-5, -6, -5, 6, 5, 0], { closed: true, fill: "ink" }), body([5, -6, 5, 6]));
  else if (kind === "tvs") g.push(body([-10, -6, -10, 6, 0, 0], { closed: true, fill: "ink" }), body([10, -6, 10, 6, 0, 0], { closed: true, fill: "ink" }), body([0, -6, 0, 6]));
  return g;
}
// transistor: drain at the top (−y), source at the bottom, gate plate on the left; m = 1
function fetGlyph(type) {
  const g = [], ch = -16;
  g.push(body([-22, -14, -22, 14]));
  for (const [a, b] of [[-20, -11], [-4.5, 4.5], [11, 20]]) g.push(body([ch, a, ch, b]));
  g.push(body([ch, -16, 0, -16]), body([ch, 16, 0, 16]), body([ch, 0, 0, 0, 0, 16]));
  const [tip, base] = type === "pfet" ? [ch + 11, ch + 4] : [ch + 1, ch + 8];
  g.push(body([tip, 0, base, -3.5, base, 3.5], { closed: true, fill: "ink" }));
  return g;
}
function groundGlyph(x0, net) {          // bars across the axis, starting at x0
  const d = Math.max(2.5, GW * 1.4), w = Math.max(5, GW * 2.2);
  return [[0, 1], [1, 0.6], [2, 0.2]].map(([k, f]) => P([x0 + k * d, -w * f, x0 + k * d, w * f], { stroke: "ink", w: GW, role: "net", net, z: 2 }));
}

// ---------------------------------------------------------------------
// Build: data → primitives and texts in world millimetres, per area
// ---------------------------------------------------------------------
const PRIMS = [];          // { a: area, path: Path2D, mode, stroke, fill, w, role, net, part, z, box }
const TEXTS = [];          // { a, s, x, y, px, face, align, base, angle, col, role, net, part }
function place(prims, ox, oy, ux, uy, area, part) {
  // local px → world: origin + K·(x·u + y·v), v = u turned 90° (so +y stays "down" for u = +x)
  const vx = -uy, vy = ux;
  for (const p of prims) {
    const path = new Path2D(), box = [Infinity, Infinity, -Infinity, -Infinity];
    const at = (x, y) => { const X = ox + K * (x * ux + y * vx), Y = oy + K * (x * uy + y * vy); box[0] = Math.min(box[0], X); box[1] = Math.min(box[1], Y); box[2] = Math.max(box[2], X); box[3] = Math.max(box[3], Y); return [X, Y]; };
    if (p.circle) { const [X, Y] = at(p.circle[0], p.circle[1]), r = p.circle[2] * K; path.moveTo(X + r, Y); path.arc(X, Y, r, 0, Math.PI * 2); box[0] = X - r; box[1] = Y - r; box[2] = X + r; box[3] = Y + r; }
    else { for (let i = 0; i < p.pts.length; i += 2) { const [X, Y] = at(p.pts[i], p.pts[i + 1]); i ? path.lineTo(X, Y) : path.moveTo(X, Y); } if (p.closed) path.closePath(); }
    PRIMS.push({ a: area, path, stroke: p.stroke, fill: p.fill, w: p.w, role: p.role, net: p.net ?? -1, part, z: p.z ?? 1, box });
  }
}
// a world-coordinate polyline or circle (wires, KiCad body shapes)
function worldPrim(area, pts, o, part) {
  const path = new Path2D(), box = [Infinity, Infinity, -Infinity, -Infinity];
  if (o.circle) { const [x, y, r] = o.circle; path.moveTo(x + r, y); path.arc(x, y, r, 0, Math.PI * 2); box.splice(0, 4, x - r, y - r, x + r, y + r); }
  else for (let i = 0; i < pts.length; i += 2) { i ? path.lineTo(pts[i], pts[i + 1]) : path.moveTo(pts[i], pts[i + 1]); box[0] = Math.min(box[0], pts[i]); box[1] = Math.min(box[1], pts[i + 1]); box[2] = Math.max(box[2], pts[i]); box[3] = Math.max(box[3], pts[i + 1]); }
  if (o.closed) path.closePath();
  PRIMS.push({ a: area, path, stroke: o.stroke, fill: o.fill, w: o.w, role: o.role, net: o.net ?? -1, part, z: o.z ?? 1, box, cap: o.cap });
}
const PX = { pin: 9, val: 9, tag: 9, name: 11.5, pn: 9, area: 13 };
function text(area, s, x, y, o) { TEXTS.push({ a: area, s, x, y, angle: 0, align: "left", base: "middle", col: "ink", role: "body", net: -1, lvl: "pin", ...o, px: (o.px || 9) * (o.face === "name" ? NAMESCALE : TEXTSCALE) }); }
// cut a text to n characters with an ellipsis (the tooltip has it all)
const fitStr = (t, n) => t.length > n ? t.slice(0, Math.max(1, n - 1)).trimEnd() + "…" : t;
const monoW = (s, px) => String(s).replace(/[~_^]\{([^}]*)\}/g, "$1").length * px * 0.6 * TEXTSCALE * K;   // IBM Plex Mono: 0.6 em per character

// what a part's label says: its value where it has one (10k, 100n), else its designator (TP30M, ESD2C); the designator second
const HAS_VALUE = new Set(["r", "c", "l", "fb"]);
function labelLines(k, ref, v) {
  if (HAS_VALUE.has(k) && v) return { lines: [short(v), ref], lvls: ["value", "ref"] };
  return { lines: [ref], lvls: ["value"] };
}
// ohms from a value like 0R, 4.7R, 10k, 2.2M, 0.005R (NaN when it is not a resistance)
function ohms(v) { const m = String(v || "").trim().match(/^([\d.]+)\s*([RkKM]?)([\d]*)/); if (!m) return NaN; const mult = { "": 1, R: 1, k: 1e3, K: 1e3, M: 1e6 }[m[2]]; return parseFloat(m[1] + (m[3] ? "." + m[3] : "")) * mult; }
const notFitted = v => /^(NC|DNP|DNF|not ?fitted)$/i.test(String(v || "").trim());
const short = v => String(v || "").replace(/\s/g, "").replace(/uF$/i, "µ").replace(/µF$/, "µ").replace(/nF$/i, "n").replace(/pF$/i, "p").replace(/uH$/i, "µH").replace(/^NC$/, "not fitted");
const OBST = [];           // per area: rectangles that labels must not touch
function build() {
  const t0 = performance.now();
  D.netParts = new Map(); D.partNets = new Map(); D.byRef = new Map(); D.netIndex = new Map(D.nets.map((n, i) => [n, i]));
  const LABELS = [];
  D.areas.forEach((A, ai) => {
    const ox = A.ox, oy = A.oy, ob = OBST[ai] = [];
    const wx = x => x + ox, wy = y => y + oy;
    A.box = [A.bb[0] + ox, A.bb[1] + oy, A.bb[2] + ox, A.bb[3] + oy];
    // wires, with square ends like Schematik's lines
    for (const w of A.wires) { worldPrim(ai, [wx(w[0]), wy(w[1]), wx(w[2]), wy(w[3])], { stroke: w[4], w: weight(w[4]), role: "net", net: w[4], z: 0, cap: "square" });
      const h = weight(w[4]) * K / 2 + K; ob.push([Math.min(wx(w[0]), wx(w[2])) - h, Math.min(wy(w[1]), wy(w[3])) - h, Math.max(wx(w[0]), wx(w[2])) + h, Math.max(wy(w[1]), wy(w[3])) + h]); }
    // a test point on a line needs no junction dot: its circle already says it is there
    const tpAt = new Set(A.parts.filter(q => /^TP\d/.test(q.r)).flatMap(q => q.p.map(p => Math.round(p[0] * 100) + "," + Math.round(p[1] * 100))));
    for (const j of A.junctions) { if (tpAt.has(Math.round(j[0] * 100) + "," + Math.round(j[1] * 100))) continue; const r = Math.max(2.4, weight(j[2]) * 0.9 + 1) * K; worldPrim(ai, null, { circle: [wx(j[0]), wy(j[1]), r], fill: j[2], role: "net", net: j[2], z: 3 }); }
    for (const [x, y] of A.nc) { const r = 3 * K; worldPrim(ai, [wx(x) - r, wy(y) - r, wx(x) + r, wy(y) + r], { stroke: "ink3", w: 1.2, role: "body", z: 1 }); worldPrim(ai, [wx(x) + r, wy(y) - r, wx(x) - r, wy(y) + r], { stroke: "ink3", w: 1.2, role: "body", z: 1 }); }
    // net names where a line stops (KiCad labels): just the name, in the line's colour, continuing the line:
    // after its end, centred on it, so it is never unclear which line a name belongs to
    const named = [];
    for (const L of A.labels) {
      const s = shortName(L.n) || L.s; if (!s) continue;
      const x = wx(L.x), y = wy(L.y), off = 3 * K, hh = PX.tag * K * TEXTSCALE, wdt = monoW(s, PX.tag);
      if (named.some(q => q.n === L.n && Math.hypot(q.x - x, q.y - y) < 1)) continue;          // the same name twice on one spot
      named.push({ n: L.n, x, y });
      const at = (px, py) => Math.abs(px - L.x) < 0.01 && Math.abs(py - L.y) < 0.01;
      const ending = A.wires.filter(w => w[4] === L.n && (at(w[0], w[1]) || at(w[2], w[3])));
      const through = A.wires.some(w => w[4] === L.n && !at(w[0], w[1]) && !at(w[2], w[3]) && segDist(L.x, L.y, w[0], w[1], w[2], w[3]) < 0.01);
      let out = null;
      if (ending.length === 1 && !through) { const w = ending[0], fx = at(w[0], w[1]) ? w[2] : w[0], fy = at(w[0], w[1]) ? w[3] : w[1]; out = [Math.sign(L.x - fx), Math.sign(L.y - fy)]; }
      else if (!ending.length && !through) {           // straight on a pin: the way the pin points
        for (const q of A.parts) for (const p of q.p) if (at(p[0], p[1]) && p[8] !== -1) out = [Math.sign(p[0] - p[5]), Math.sign(p[1] - p[6])];
      }
      const o = { px: PX.tag, face: "mono", col: L.n, role: "net", net: L.n, lvl: "tag", base: "middle" };
      if (out && out[0]) {
        text(ai, s, x + out[0] * off, y, { ...o, align: out[0] > 0 ? "left" : "right" });
        ob.push(out[0] > 0 ? [x, y - hh / 2, x + off + wdt, y + hh / 2] : [x - off - wdt, y - hh / 2, x, y + hh / 2]);
      } else if (out && out[1]) {
        text(ai, s, x, y + out[1] * off, { ...o, angle: 90, align: out[1] < 0 ? "left" : "right" });
        ob.push(out[1] < 0 ? [x - hh / 2, y - off - wdt, x + hh / 2, y] : [x - hh / 2, y, x + hh / 2, y + off + wdt]);
      } else {
        // in the middle of a line or at a junction: on top of the line, as KiCad draws it
        const vert = L.a === 90, run = L.h < 0 ? 1 : -1;
        text(ai, s, vert ? x - off : x, vert ? y : y - off, { ...o, base: "alphabetic", angle: vert ? 90 : 0, align: run > 0 ? "left" : "right" });
        if (!vert) ob.push(run > 0 ? [x, y - hh - off, x + wdt, y] : [x - wdt, y - hh - off, x, y]);
      }

  return `<div class="t-name">${esc(netLabel(n))}</div>` + (d ? `<div class="t-desc">${esc(d)}</div>` : "") +
         `<div class="t-net">${esc(g ? g[1] : "")}${shortName(n) ? "" : " · " + esc(D.nets[n])} · ${ps ? ps.size : 0} parts</div><div class="t-pins">${connects(n)}</div>`;
}
function showTip(h, cx, cy) {
  if (tipPinned) return;
  let html = "";
  if (h.kind === "part") html = partHtml(h.ref) + pinList(h.ref);
  else if (h.kind === "pin") { const p = h.pin, same = (D.byRef.get(h.ref) || []).flatMap(r => r.part.p).filter(q => q[4] === p[4] && (q === p || q[8] === -1)).map(q => q[2]);
    html = partHtml(h.ref) + `<div class="t-net">pin ${esc(same.join(" "))}${p[3] && p[3] !== p[2] && p[3] !== "~" ? " " + esc(plain(p[3])) : ""} → ${esc(netLabel(p[4]))}</div>` + (netDesc(p[4]) ? `<div class="t-desc">${esc(netDesc(p[4]))}</div>` : ""); }
  else if (h.kind === "net") html = netHtml(h.n);
  else if (h.kind === "sheet") html = `<div class="t-name">${esc(D.areas[h.e.target].title)}</div><div class="t-net">click to go to this area</div>`;
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(cx + 16, innerWidth - r.width - 10) + "px"; tip.style.top = Math.min(cy + 16, innerHeight - r.height - 10) + "px";
}
const hideTip = () => { if (!tipPinned) tip.style.opacity = 0; };

// ---------------------------------------------------------------------
// Legend (Schematik's aside): lines, symbols, areas, view
// ---------------------------------------------------------------------
function drawLegend() {
  const box = document.getElementById("legend"), layout = box.closest(".layout"), key = "mynd-legend-collapsed";
  box.textContent = "";
  const fold = document.createElement("button"); fold.className = "lg-fold";
  const setFolded = f => { layout.classList.toggle("folded", f); fold.textContent = f ? "legend" : "hide legend"; try { localStorage.setItem(key, f ? "1" : ""); } catch {} };
  fold.onclick = () => setFolded(!layout.classList.contains("folded")); box.append(fold);
  let folded = false; try { folded = localStorage.getItem(key) === "1"; } catch {} setFolded(folded);
  const head = t => { const h = document.createElement("h2"); h.textContent = t; box.append(h); };
  // a row: a little canvas with the symbol, then the words; hovering lights those things on the map
  const row = (paintFn, label, h, sel, desc) => {
    const d = document.createElement("div"); d.className = "lg-row";
    const c = document.createElement("canvas"), dpr = Math.min(devicePixelRatio || 1, 2), hh = h || 24 + GW * 2;
    c.width = 44 * dpr; c.height = hh * dpr; c.style.width = "44px"; c.style.height = hh + "px";
    const g = c.getContext("2d"); g.scale(dpr, dpr); g.lineCap = "butt"; g.lineJoin = "miter"; paintFn(g, 22, hh / 2);
    const t = document.createElement("span"); t.textContent = label; d.append(c, t); box.append(d);
    if (!sel) return;
    d.classList.add("live");
    d.addEventListener("pointerenter", e => { if (!pinned) { hover = sel; draw(); } if (!tipPinned) showTipHtml(e, `<div class="t-name">${esc(label)}</div>${desc ? `<div class="t-desc">${esc(desc)}</div>` : ""}`); });
    d.addEventListener("pointermove", e => { if (!tipPinned) showTipHtml(e); });
    d.addEventListener("pointerleave", () => { hideTip(); if (!pinned) { hover = null; draw(); } });
    d.addEventListener("click", e => { const again = selKey(pinned) === selKey(sel); pinned = again ? null : sel; hover = null; draw(); send(pinned, true);
      if (again) { unpinTip(); hideTip(); } else { unpinTip(); showTipHtml(e); pinTip(); } });
  };
  const prims = (g, list, x, y, s = 1) => { for (const p of list) { g.beginPath();
    if (p.circle) g.arc(x + p.circle[0] * s, y + p.circle[1] * s, p.circle[2] * s, 0, Math.PI * 2);
    else { for (let i = 0; i < p.pts.length; i += 2) (i ? g.lineTo : g.moveTo).call(g, x + p.pts[i] * s, y + p.pts[i + 1] * s); if (p.closed) g.closePath(); }
    if (p.fill) { g.fillStyle = resolve(p.fill); g.fill(); }
    if (p.stroke != null) { g.strokeStyle = typeof p.stroke === "number" ? INK.ink : resolve(p.stroke); g.lineWidth = p.w; g.stroke(); } } };
  const line = (w, c) => (g, x, y) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(4, y); g.lineTo(40, y); g.stroke(); };
  const netsOfGroup = gi => D.netMeta.nets.map((m, i) => m[1] === gi ? i : -1).filter(i => i >= 0 && (D.netParts.get(i) || new Set()).size);
  head("Lines");
  if (MULTI) D.netMeta.groups.forEach(([c, label, power, desc], gi) => {
    const nets = netsOfGroup(gi); if (!nets.length) return;
    row(line((power && !UNIFORM ? LW * 1.6 : LW), gi === 0 ? INK.ink : c), label, null, groupSel(nets), desc + (nets.length < 9 ? " " + nets.map(n => shortName(n)).filter(Boolean).join(" · ") : ""));
  });
  else {
    const supply = D.nets.map((_, i) => i).filter(isPower), signal = D.nets.map((_, i) => i).filter(i => !isPower(i));
    if (UNIFORM) row(line(LW, INK.ink), "connection", null, groupSel([...supply, ...signal]), "Every line has the same weight in this view.");
    else { row(line(LW * 1.6, INK.ink), "supply and ground", null, groupSel(supply), "Lines that carry power: drawn heavier.");
      row(line(LW, INK.ink), "signal", null, groupSel(signal), "Lines that carry information or control."); }
  }
  row((g, x, y) => { line(LW, INK.ink)(g, x, y); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 12); g.stroke(); g.beginPath(); g.arc(x, y, Math.max(2.4, LW * 0.9 + 1), 0, Math.PI * 2); g.fillStyle = INK.ink; g.fill(); }, "joined", null, null);
  row((g, x, y) => { line(LW, INK.ink)(g, x, y); g.beginPath(); g.moveTo(x, y - 10); g.lineTo(x, y + 10); g.stroke(); }, "crossing, not joined", null, null);
  row((g, x, y) => { g.strokeStyle = INK.ink; g.lineWidth = LW; g.beginPath(); g.moveTo(2, y); g.lineTo(14, y); g.stroke(); g.fillStyle = INK.ink; g.font = '9px "IBM Plex Mono", monospace'; g.textBaseline = "middle"; g.fillText("SDA", 17, y); }, "continues at the same name elsewhere", null, null);
  head("Symbols");
  const partsOf = k => [...D.byRef.values()].map(r => r[0]).filter(r => r.part.k === k).map(r => r.ref);
  const sym = (k, label, desc, paintFn, h) => { const ids = partsOf(k); if (ids.length) row(paintFn, `${label} (${ids.length})`, h, groupSel([], ids), desc); };
  const two = k => (g, x, y) => { g.strokeStyle = INK.ink; g.lineWidth = LW; g.beginPath(); g.moveTo(4, y); g.lineTo(x - ALONG[k], y); g.moveTo(x + ALONG[k], y); g.lineTo(40, y); g.stroke(); prims(g, glyph2(k), x, y); };
  sym("r", "resistor", "Limits current or sets a voltage.", two("r"));
  sym("c", "capacitor", "Stores a little charge to smooth a supply or slow a signal down.", two("c"));
  sym("l", "inductor", "Stores energy in a magnetic field; smooths a switching supply.", two("l"));
  sym("fb", "ferrite bead", "Soaks up high-frequency noise on a line.", two("fb"));
  sym("d", "diode", "Lets current flow one way only.", two("d"));
  sym("tvs", "ESD protection diode", "Clamps static shocks to ground before they reach the chip.", two("tvs"));
  const fet = k => (g, x, y) => { prims(g, fetGlyph(k), 30, y, 0.8); g.strokeStyle = INK.ink; g.lineWidth = GW; g.beginPath(); g.moveTo(4, y); g.lineTo(30 - 22 * 0.8, y); g.stroke(); };
  sym("nfet", "N-channel MOSFET", "A switch that turns on when its gate is above its source.", fet("nfet"), 40 + GW * 2);
  sym("pfet", "P-channel MOSFET", "A switch that turns on when its gate is below its source; it switches the positive supply.", fet("pfet"), 40 + GW * 2);
  sym("tp", "test point", "A pad to reach a signal with a probe.", (g, x, y) => { g.strokeStyle = INK.ink; g.lineWidth = LW; g.beginPath(); g.moveTo(4, y); g.lineTo(x, y); g.stroke(); prims(g, [P(null, { circle: [3.5, 0, 3.5], stroke: "ink", fill: "bg", w: GW })], x, y); });
  sym("box", "chip or connector", "Its pins are named inside the outline.", (g, x, y) => { g.strokeStyle = INK.ink; g.lineWidth = GW; g.strokeRect(12, y - 9, 22, 18); g.lineWidth = LW; g.beginPath(); g.moveTo(2, y); g.lineTo(12, y); g.stroke(); });
  row((g, x, y) => { g.strokeStyle = INK.ink; g.lineWidth = LW; g.beginPath(); g.moveTo(x, y - 9); g.lineTo(x, y - 2); g.stroke(); prims(g, groundGlyph(0, 0).map(p => ({ ...p, pts: [p.pts[1], p.pts[0], p.pts[3], p.pts[2]] })), x, y - 2); }, "ground", null, D.netIndex.has("GND") ? netSel(D.netIndex.get("GND")) : null, "The common 0 V return for every circuit.");
  // where the power comes from and where it goes: hover a step to see it on the map
  head("Power");
  const tree = document.createElement("div"); tree.className = "lg-power"; box.append(tree);
  for (const [depth, nets, refs, txt] of D.netMeta.power) {
    const idx = nets.map(n => D.netIndex.get(n) ?? D.nets.findIndex(x => x.endsWith("/" + n))).filter(i => i >= 0);
    const r = document.createElement("div"); r.className = "lg-row live lg-step"; r.style.paddingLeft = depth * 10 + "px";
    const sw = document.createElement("i"); sw.style.background = idx.length ? netColor(idx[0]) : "transparent"; sw.style.height = (idx.length && isPower(idx[0]) && !UNIFORM ? LW * 1.6 : LW) + "px";
    const t = document.createElement("span"); t.textContent = txt; r.append(sw, t); tree.append(r);
    const sel = groupSel(idx, refs.filter(x => D.byRef.has(x))), html = `<div class="t-name">${esc(txt)}</div>` + idx.map(n => `<div class="t-desc"><b>${esc(netLabel(n))}</b>: ${esc(netDesc(n))}</div>`).join("");
    r.addEventListener("pointerenter", e => { if (!pinned) { hover = sel; draw(); } if (!tipPinned) showTipHtml(e, html); });
    r.addEventListener("pointermove", e => { if (!tipPinned) showTipHtml(e); });
    r.addEventListener("pointerleave", () => { hideTip(); if (!pinned) { hover = null; draw(); } });
    r.addEventListener("click", e => { const again = selKey(pinned) === selKey(sel); pinned = again ? null : sel; hover = null; draw(); send(pinned, true); flyToSel(sel);
      if (again) { unpinTip(); hideTip(); } else { unpinTip(); showTipHtml(e, html); pinTip(); } });
  }
  head("Areas");
  D.areas.forEach((A, i) => { const b = document.createElement("button"); b.className = "lg-area"; b.textContent = `${i + 1}  ${A.title}`; b.onclick = () => showArea(i); box.append(b); });
  head("View");
  const links = document.createElement("div"); links.className = "lg-links";
  const link = (label, params) => { const a = document.createElement("a"); const q = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(params)) v == null ? q.delete(k) : q.set(k, v); a.href = "?" + q.toString(); a.textContent = label; links.append(a); };
  link(MULTI ? "single ink" : "colour", { color: MULTI ? "ink" : null });
  link(LW > 2 ? "thin lines" : "metro lines", { width: LW > 2 ? "1.1" : null });
  link(UNIFORM ? "weighted" : "uniform", { uniform: UNIFORM ? "0" : null });
  box.append(links);
  const sizes = document.createElement("div"); sizes.className = "lg-links lg-text"; sizes.title = "Text size";
  for (const [k, scale, px] of [["normal", 1, 11], ["big", 1.3, 14], ["giant", 1.65, 18]]) {
    const q = new URLSearchParams(location.search); k === "big" ? q.delete("text") : q.set("text", k);
    const a = document.createElement(scale === TEXTSCALE ? "span" : "a"); a.textContent = "A"; a.style.fontSize = px + "px";
    if (scale === TEXTSCALE) a.className = "on"; else a.href = "?" + q.toString();
    sizes.append(a);
  }
  box.append(sizes);
}
function showTipHtml(e, html) {
  if (html) tip.innerHTML = html; tip.style.opacity = 1;
  // the legend sits on the right: its tooltips open to the left of the pointer, over the map
  const w = tip.offsetWidth, left = e.clientX > innerWidth - 420 ? e.clientX - w - 16 : e.clientX + 16;
  tip.style.left = Math.max(8, Math.min(left, innerWidth - w - 10)) + "px"; tip.style.top = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 10) + "px";
}

// ---------------------------------------------------------------------
// Find
// ---------------------------------------------------------------------
function selectByName(v, fly) {
  let s = null;
  const ref = D.byRef.has(v) ? v : [...D.byRef.keys()].find(r => r.toLowerCase() === v.toLowerCase());
  if (ref) s = partSel(ref);
  else {
    const lv = v.toLowerCase();
    let n = D.nets.findIndex(x => x.toLowerCase() === lv); if (n < 0) n = D.netMeta.nets.findIndex(m => m[0].toLowerCase() === lv || m[0].replace(/[~{}]/g, "").toLowerCase() === lv);
    if (n >= 0) s = netSel(n);
  }
  if (!s) { status.textContent = `nothing called ${v}`; return false; }
  pinned = s; hover = null; draw(); send(pinned, true);
  if (fly) flyToSel(s);
  return true;
}
function flyToSel(s) {
  const b = [Infinity, Infinity, -Infinity, -Infinity], grow = q => { b[0] = Math.min(b[0], q[0]); b[1] = Math.min(b[1], q[1]); b[2] = Math.max(b[2], q[2]); b[3] = Math.max(b[3], q[3]); };
  if (s.kind !== "net") for (const r of s.parts) for (const rec of D.byRef.get(r) || []) grow(rec.box);
  if (s.kind !== "part") for (const p of PRIMS) if (p.role === "net" && s.nets.has(p.net)) grow(p.box);
  if (s.kind === "part") {
    const areas = new Set([...s.parts].flatMap(r => (D.byRef.get(r) || []).map(x => x.area)));
    for (const p of PRIMS) if (p.role === "net" && areas.has(p.a) && s.nets.has(p.net) && !isRail(p.net)) grow(p.box);
  }
  if (!isFinite(b[0])) return;
  const MIN = 80, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, hw = Math.max(MIN, b[2] - b[0]) / 2 + 4, hh = Math.max(MIN * 0.6, b[3] - b[1]) / 2 + 4;
  flyTo([cx - hw, cy - hh, cx + hw, cy + hh], 40, 1e9);
}
function buildFind() {
  const dl = document.getElementById("finds");
  dl.innerHTML = [...D.byRef.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(r => `<option value="${esc(r)}">${esc((D.parts[r] || {}).v || "")}</option>`).join("") +
                 D.netMeta.nets.map(m => m[0]).filter(Boolean).map(s => `<option value="${esc(s)}"></option>`).join("");
  const find = document.getElementById("find"), go = () => { const v = find.value.trim(); if (v) selectByName(v, true); };
  find.addEventListener("change", go); find.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

// ---------------------------------------------------------------------
// Sync with board3d.html: { type: "focus", source, kind, parts: [refs], nets: [names], pinned }
// ---------------------------------------------------------------------
const bus = "BroadcastChannel" in window ? new BroadcastChannel("mynd") : null;
let lastSent = "";
function send(sel, isPinned) {
  if (!bus) return;
  const msg = { type: "focus", source: "schematic", kind: sel ? (sel.kind === "group" ? "net" : sel.kind) : null, parts: sel ? [...sel.parts] : [], nets: sel ? [...sel.nets].map(n => D.nets[n]) : [], pinned: !!isPinned };
  const key = JSON.stringify(msg); if (key === lastSent) return; lastSent = key; bus.postMessage(msg);
}
if (bus) bus.onmessage = e => {
  const m = e.data; if (!m || m.type !== "focus" || m.source === "schematic" || !D) return;
  let s = null;
  if (m.kind === "net" && m.nets && m.nets.length) { const n = D.netIndex.get(m.nets[0]); if (n !== undefined) s = netSel(n); }
  else if (m.parts && m.parts.length) { const r = m.parts.find(r => D.byRef.has(r)); if (r) s = partSel(r); }
  if (m.pinned) { pinned = s; hover = null; if (s) flyToSel(s); } else hover = s;
  draw();
};

// ---------------------------------------------------------------------
// Load
// ---------------------------------------------------------------------
(async () => {
  try { const r = await fetch(DATA_URL); if (!r.ok) throw new Error(r.status); D = await r.json(); }
  catch (err) { document.getElementById("drop").classList.add("show"); status.textContent = "no data"; return; }
  if (document.fonts) await Promise.race([document.fonts.load('9px "IBM Plex Mono"'), new Promise(r => setTimeout(r, 1500))]);
  build(); buildFind(); drawLegend();
  DPR = Math.min(devicePixelRatio || 1, 2); W = view.clientWidth; H = view.clientHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const aq = QS.get("area"), ai = aq ? D.areas.findIndex(A => A.name === aq || A.name.replace(/^U_/, "") === aq) : -1;
  const centre = b => { const s = fitScale(b, 30); cam.s = s; cam.x = W / 2 - (b[0] + b[2]) / 2 * s; cam.y = H / 2 - (b[1] + b[3]) / 2 * s; };
  if (ai >= 0) centre(D.areas[ai].box); else if (!restoreView()) centre(D.extent);
  status.textContent = `${D.byRef.size} parts · ${D.nets.length} nets · ${D.areas.length} areas`;
  if (QS.get("select")) selectByName(QS.get("select"), true);
  paint();                       // straight away: animation frames wait while the tab is in the background
})();
</script>
