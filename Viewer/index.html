<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYND Main Viewer</title>
<style>
:root { color-scheme: light; --bg: #fff; --ink-3: #b4b3ae; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #161616; --ink-3: #55554f; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #161616; --ink-3: #55554f; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body { display: grid; grid-template-columns: 3fr 2fr; }
iframe { width: 100%; height: 100%; border: 0; }
iframe + iframe { border-left: 1px solid var(--ink-3); }
@media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 3fr 2fr; } iframe + iframe { border-left: 0; border-top: 1px solid var(--ink-3); } }
</style>
</head>
<body>
<!-- the two views talk over a BroadcastChannel: pick a part or net in one and the other follows -->
<iframe src="schematic.html" title="Schematic"></iframe>
<iframe src="board3d.html" title="3D board"></iframe>
</body>
</html>
